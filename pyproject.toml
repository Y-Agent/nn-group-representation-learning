[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["reproduction", "notebooks", "scripts/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"paper_reproduction/notebook_adapter.py" = ["F403", "F405"]
